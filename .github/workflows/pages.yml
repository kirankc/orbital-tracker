name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours, matching CelesTrak's element update cadence
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore data caches (orbital elements, GCAT tables)
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/gp.json
            data/gp-meta.json
            data/ext-cache.json
          key: tracker-data-${{ github.run_id }}
          restore-keys: |
            tracker-data-
      - run: npm ci
      - run: node scripts/build-static.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
